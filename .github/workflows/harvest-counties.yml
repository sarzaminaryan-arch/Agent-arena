name: Harvest county data

on:
  push:
    paths:
      - 'content/data/harvest-request.json'
      - 'content-templates/tools/geo/**'
      - '.github/workflows/harvest-counties.yml'
  workflow_dispatch:
    inputs:
      province:
        description: 'نامک استان (خالی = همهٔ ۳۱ استان)'
        required: false
        default: ''
      sources:
        description: 'منابع برداشت؛ poi = مرحلهٔ جاذبه‌ها بدون تغییر آمار'
        required: true
        default: 'both'
        type: choice
        options: [both, wikidata, wikipedia, none, poi]
      stubs:
        description: 'ساخت اسکلت مقاله در content/cities/'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: county-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scope
        id: scope
        env:
          IN_PROVINCE: ${{ inputs.province }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_STUBS: ${{ inputs.stubs }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'content-templates/tools/geo')
          import registry
          province = os.environ.get('IN_PROVINCE') or 'all'
          sources = os.environ.get('IN_SOURCES') or 'both'
          stubs = os.environ.get('IN_STUBS', 'false').lower() == 'true'
          if os.environ['EVENT_NAME'] != 'workflow_dispatch':
              with open('content/data/harvest-request.json', encoding='utf-8') as fh:
                  request = json.load(fh)
              province = request.get('province') or 'all'
              sources = request.get('sources') or 'both'
              stubs = request.get('stubs', False)
          if province != 'all' and province not in registry.by_province():
              raise SystemExit('Unknown province; no harvest will run')
          if sources not in ('both', 'wikidata', 'wikipedia', 'none', 'poi'):
              raise SystemExit('Unknown source mode')
          if not isinstance(stubs, bool):
              raise SystemExit('stubs must be a boolean')
          flag = '--all' if province == 'all' else '--province ' + province
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('flag=' + flag + '\n')
              output.write('label=' + ('all provinces' if province == 'all' else province) + '\n')
              output.write('sources=' + sources + '\n')
              output.write('stubs=' + str(stubs).lower() + '\n')
          print('scope:', province, sources, 'stubs=', stubs)
          PY

      - name: Offline pipeline regression tests
        run: python3 -m unittest discover -s content-templates/tools/geo/tests -v

      - name: Harvest Wikidata
        if: steps.scope.outputs.sources == 'both' || steps.scope.outputs.sources == 'wikidata'
        run: python3 content-templates/tools/geo/harvest_wikidata.py ${{ steps.scope.outputs.flag }} --sleep 3

      - name: Harvest Wikipedia (fa)
        if: steps.scope.outputs.sources == 'both' || steps.scope.outputs.sources == 'wikipedia'
        run: python3 content-templates/tools/geo/harvest_wikipedia.py ${{ steps.scope.outputs.flag }} --sleep 1

      - name: Merge into fact files
        if: steps.scope.outputs.sources != 'poi'
        run: python3 content-templates/tools/geo/merge_facts.py ${{ steps.scope.outputs.flag }}

      - name: Derive calculated fields
        if: steps.scope.outputs.sources != 'poi'
        run: python3 content-templates/tools/geo/enrich_facts.py

      - name: Draft editorial fields (climate/best time/language/livelihood)
        if: steps.scope.outputs.sources != 'poi'
        run: python3 content-templates/tools/geo/profile_facts.py

      - name: Harvest sourced attraction lists (pass 4)
        if: steps.scope.outputs.sources == 'poi'
        run: python3 content-templates/tools/geo/harvest_poi.py ${{ steps.scope.outputs.flag }} --sleep 1 --refresh-drafts

      # An ERROR stops export and publication; WARNs remain visible for editorial review.
      - name: Validate
        run: python3 content-templates/tools/geo/validate_facts.py

      - name: Coverage matrix
        run: python3 content-templates/tools/geo/coverage_facts.py

      - name: Export WordPress payloads
        run: |
          python3 content-templates/tools/geo/export_meta.py ${{ steps.scope.outputs.flag }} \
            ${{ steps.scope.outputs.stubs == 'true' && '--stubs' || '' }}

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data content/cities
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data(counties): harvest ${{ steps.scope.outputs.label }} (${{ steps.scope.outputs.sources }})"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## پوشش دادهٔ شهرستان‌ها"
            echo
            [ ! -f content/data/COUNTY-POI-PASS4.md ] || sed -n '1,65p' content/data/COUNTY-POI-PASS4.md
            [ ! -f content/data/COUNTY-FACTS-COVERAGE.md ] || sed -n '1,45p' content/data/COUNTY-FACTS-COVERAGE.md
            echo
            echo "## اعتبارسنجی"
            echo
            [ ! -f content/data/COUNTY-FACTS-ISSUES.md ] || sed -n '1,40p' content/data/COUNTY-FACTS-ISSUES.md
          } >> "$GITHUB_STEP_SUMMARY"
